name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -b

      - name: Run tests
        run: npm test

  build-push:
    name: Build and publish image
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: |
            teeaye205/run2compose:${{ github.sha }}
            teeaye205/run2compose:latest
          cache-from: type=registry,ref=teeaye205/run2compose:latest
          cache-to: type=inline

      - name: Verify image was pushed to Docker Hub
        run: |
          docker buildx imagetools inspect teeaye205/run2compose:${GITHUB_SHA}
          docker buildx imagetools inspect teeaye205/run2compose:latest
