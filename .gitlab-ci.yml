# run2compose — GitLab CI/CD
#
# test       — every push: typecheck + unit tests
# build-push — default branch only: build image with the project's own
#              Dockerfile and push to the GitLab Container Registry as
#              :<commit-sha> and :latest (only when the tests passed)

stages:
    - test
    - build

default:
    interruptible: true

test:
    stage: test
    image: node:22-alpine
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - .npm/
    variables:
        npm_config_cache: "$CI_PROJECT_DIR/.npm"
    script:
        - npm ci --no-audit --no-fund
        - npx tsc -b
        - npm test

build-push:
    stage: build
    needs: [test]
    image: docker:29
    services:
        - docker:29-dind
    variables:
        DOCKER_TLS_CERTDIR: "/certs"
    before_script:
        - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    script:
        - >
            docker build
            --pull
            --cache-from "$CI_REGISTRY_IMAGE:latest"
            --cache-to type=inline
            --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
            --tag "$CI_REGISTRY_IMAGE:latest"
            .
        - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        - docker push "$CI_REGISTRY_IMAGE:latest"
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
