services:
    run2compose:
        build: .
        image: run2compose:latest
        container_name: run2compose
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.run2compose.rule=Host(`run2compose.deathstar.pve.teeaye.us`)"
            - "traefik.http.routers.run2compose.entrypoints=websecure"
            - "traefik.http.routers.run2compose.tls=true"
            - "traefik.http.routers.run2compose.tls.certresolver=le"
            - "traefik.http.services.run2compose.loadbalancer.server.port=80"
        networks:
            - traefik

networks:
    traefik:
        external: true
